[package]
name = "pdf-maker"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLI tool for merging, watermarking, and manipulating PDF files"
repository = "https://github.com/ComposerChrisF/pdf-maker"
keywords = ["pdf", "merge", "watermark", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "pdf-maker"
path = "src/main.rs"

[dependencies]
medpdf = { version = "0.10.0", path = "../medpdf/medpdf" }
medpdf-image = { version = "0.3.0", path = "../medpdf/medpdf-image" }
lopdf = "0.39.0"
clap = { version = "4.5.44", features = ["derive", "string"] }
chrono = "0.4"
uuid = { version = "1.18.0", features = ["v4", "fast-rng"] }
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
