[package]
name = "pdf-maker"
version = "0.24.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLI tool for merging, watermarking, and manipulating PDF files"
repository = "https://github.com/ComposerChrisF/pdf-maker"
keywords = ["pdf", "merge", "watermark", "cli"]
categories = ["command-line-utilities"]
# Working-tree artifacts, not part of the published crate.  bugs/ and plans/ are
# delete-on-resolve directories (the house bug-report and plan conventions);
# without this they ship in the tarball.
exclude = ["CLAUDE.md", ".github/", ".claude/", "bugs/", "plans/"]

[[bin]]
name = "pdf-maker"
path = "src/main.rs"

[dependencies]
# Floor is 0.15 for duplicate page handling: 0.15.0 stopped `parse_page_spec`
# collapsing repeats (its plan-0006) AND stopped `copy_page_with_cache` aliasing a
# repeated page into one object (its bug-0040, filed from here). Both halves are
# required — the parser change alone would hand this crate a repeated page number
# and get back one page object listed twice, so a downgrade below 0.15 does not
# merely lose the feature, it reopens a malformed page tree (pdf-maker bug-0003).
medpdf = { version = "0.15", path = "../medpdf/medpdf" }
medpdf-image = { version = "0.4", path = "../medpdf/medpdf-image" }
lopdf = "0.42.0"
clap = { version = "4.5.44", features = ["derive", "string"] }
chrono = "0.4"
uuid = { version = "1.18.0", features = ["v4", "fast-rng"] }
env_logger = "0.11"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3"

# house-lints v1 (2026-11-14) — the [lints] table, to paste into Cargo.toml.
# A single crate: paste as is.  A workspace: rename the table to
# [workspace.lints.clippy] in the root manifest, and put `[lints] workspace = true`
# in each member.  Every level is "warn": existing violations do not block, and
# review refuses new ones.  The canonical copy lives in Chris's coding hub, under
# house-lints/.

[lints.clippy]
# Every suppression says why, and an #[expect] warns once its lint stops firing.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# No panics on input in production code (tests are allowed by clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Each of these caught a filed bug in the 2026-11-14 census.
string_slice = "warn"
let_underscore_must_use = "warn"
undocumented_unsafe_blocks = "warn"
# disallowed_methods is on by default; its list is clippy.toml.
